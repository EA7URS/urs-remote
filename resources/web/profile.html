<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EA7URS Remote · Perfil</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #071114; color: #e5f2f2; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; }
    main { width: min(100%, 42rem); padding: 2rem; border: 1px solid #17434b; border-radius: 1rem; background: #0d1d22; box-shadow: 0 1rem 4rem #0008; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { margin: 0; color: #38d1c5; font-size: 1.5rem; }
    a { color: #48cfc4; }
    p { color: #a9bfc2; line-height: 1.5; }
    label { display: block; margin: 1rem 0 .35rem; color: #b8d0d2; }
    input { width: 100%; padding: .75rem; border: 1px solid #28545b; border-radius: .45rem; background: #071114; color: #fff; font: inherit; }
    button { width: 100%; margin-top: 1.25rem; padding: .8rem; border: 0; border-radius: .45rem; background: #12a99f; color: #031415; font: inherit; font-weight: 700; cursor: pointer; }
    #notice { min-height: 1.4rem; margin-top: .8rem; color: #ff9b8f; }
    .quota-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; margin-top: 1rem; }
    .quota-card { padding: 1rem; border: 1px solid #17434b; border-radius: .65rem; background: #09171b; }
    .quota-card h3 { margin: 0 0 .65rem; color: #38d1c5; }
    .quota-card p { margin: .35rem 0; }
  </style>
</head>
<body>
<main>
  <header><h1>Administrar perfil</h1><a href="/home.html">Volver al inicio</a></header>
  <p>Usuario: <strong id="user"></strong></p>
  <h2>Datos del perfil</h2>
  <form id="profileForm">
    <label for="profileUserId">Indicativo / ID</label>
    <input id="profileUserId" name="userId" required maxlength="32" autocomplete="username">
    <label for="firstName">Nombre</label>
    <input id="firstName" name="firstName" required maxlength="120" autocomplete="given-name">
    <label for="lastName">Apellidos</label>
    <input id="lastName" name="lastName" required maxlength="120" autocomplete="family-name">
    <label for="email">Email (solo lectura)</label>
    <input id="email" name="email" type="email" readonly aria-readonly="true">
    <label for="street">Calle</label>
    <input id="street" name="street" maxlength="120" autocomplete="street-address">
    <label for="city">Población</label>
    <input id="city" name="city" maxlength="120" autocomplete="address-level2">
    <label for="postalCode">Código postal</label>
    <input id="postalCode" name="postalCode" maxlength="120" autocomplete="postal-code">
    <label for="province">Provincia (opcional)</label>
    <input id="province" name="province" maxlength="120" autocomplete="address-level1">
    <p>Perfil operativo: <strong id="operationalProfile"></strong></p>
    <p>Tiempo máximo por reserva: <strong id="maxReservationTime"></strong></p>
    <p id="reservationAvailability" aria-live="polite"></p>
    <button type="submit">Guardar datos del perfil</button>
  </form>
  <section aria-labelledby="usageTitle">
    <h2 id="usageTitle">Tiempos de uso autorizados</h2>
    <p id="usageProfileName">Consultando los límites de uso…</p>
    <div id="usagePeriods" class="quota-grid" aria-live="polite"></div>
  </section>
  <hr>
  <form id="passwordForm">
    <label for="currentPassword">Contraseña actual</label>
    <input id="currentPassword" type="password" autocomplete="current-password" required>
    <label for="newPassword">Nueva contraseña (mínimo 12 caracteres)</label>
    <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirmPassword">Confirmar nueva contraseña</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
    <button type="submit">Cambiar contraseña</button>
  </form>
  <p id="notice" role="status" aria-live="polite"></p>
</main>
<script>
const notice = document.getElementById('notice');
const periodNames = { daily: 'Diario', weekly: 'Semanal', monthly: 'Mensual' };
function formatDuration(seconds) {
  if (seconds == null) return 'Sin límite';
  let remaining = Math.max(0, Math.floor(seconds));
  const hours = Math.floor(remaining / 3600); remaining %= 3600;
  const minutes = Math.floor(remaining / 60); const secs = remaining % 60;
  const parts = [];
  if (hours) parts.push(hours + ' h');
  if (minutes) parts.push(minutes + ' min');
  if (secs && !hours) parts.push(secs + ' s');
  return parts.length ? parts.join(' ') : '0 min';
}
function formatReservationMinutes(minutes) {
  if (minutes <= 0) return 'No puede realizar reservas';
  return minutes % 60 === 0 ? (minutes / 60) + ' h' : minutes + ' min';
}
function renderUsage(usage, profileName) {
  document.getElementById('usageProfileName').textContent = 'Perfil de tiempo: ' + (profileName || usage.profileName || 'Sin límite');
  const target = document.getElementById('usagePeriods'); target.replaceChildren();
  const available = Object.keys(periodNames).filter(period => usage[period]);
  if (!available.length) {
    const message = document.createElement('p'); message.textContent = 'No tienes límites de uso asignados.'; target.append(message); return;
  }
  for (const period of available) {
    const item = usage[period]; const card = document.createElement('article'); card.className = 'quota-card';
    const title = document.createElement('h3'); title.textContent = periodNames[period]; card.append(title);
    for (const [label, value] of [
      ['Límite', item.limitMinutes == null ? 'Sin límite' : formatDuration(item.limitMinutes * 60)],
      ['Usado', formatDuration(item.usedSeconds)],
      ['Restante', formatDuration(item.remainingSeconds)]
    ]) {
      const line = document.createElement('p'); line.textContent = label + ': ' + value; card.append(line);
    }
    target.append(card);
  }
}
fetch('/api/v1/auth/me', { credentials: 'same-origin' }).then(async response => {
  if (!response.ok) { location.replace('/login.html'); return; }
  const user = await response.json();
  document.getElementById('user').textContent = user.userId;
  const profile = user.profile;
  document.getElementById('profileUserId').value = profile.userId || '';
  for (const [field, value] of Object.entries(profile)) {
    const input = document.getElementById(field);
    if (input) input.value = value || '';
  }
  document.getElementById('operationalProfile').textContent = profile.operationalProfile === 'capture'
    ? 'Usuario de captación (sin transmisión)' : 'Usuario con licencia';
  document.getElementById('maxReservationTime').textContent = formatReservationMinutes(profile.maxReservationMinutes || 0);
  const effectiveReservationMinutes = Number(user.effectiveReservationMinutes) || 0;
  document.getElementById('reservationAvailability').textContent = user.canReserve
    ? 'Según tus tiempos de uso actuales, puedes reservar hasta ' + formatReservationMinutes(effectiveReservationMinutes) + '.'
    : 'No tienes tiempo disponible para realizar reservas con los cupos de uso actuales.';
  renderUsage(user.usage || {}, user.usageProfileName);
}).catch(() => location.replace('/login.html'));
document.getElementById('profileForm').addEventListener('submit', async event => {
  event.preventDefault();
  notice.textContent = '';
  const data = Object.fromEntries(new FormData(event.target).entries());
  delete data.email;
  try {
    const response = await fetch('/api/v1/auth/profile', {
      method: 'PUT', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'No se pudo guardar el perfil.');
    document.getElementById('user').textContent = result.profile.userId;
    notice.textContent = 'Se han guardado los datos del perfil.';
  } catch (error) { notice.textContent = error.message; }
});
document.getElementById('passwordForm').addEventListener('submit', async event => {
  event.preventDefault();
  notice.textContent = '';
  const newPassword = document.getElementById('newPassword').value;
  if (newPassword !== document.getElementById('confirmPassword').value) {
    notice.textContent = 'Las contraseñas nuevas no coinciden.';
    return;
  }
  try {
    const response = await fetch('/api/v1/auth/password', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        currentPassword: document.getElementById('currentPassword').value,
        newPassword
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'No se pudo cambiar la contraseña.');
    location.replace('/home.html');
  } catch (error) { notice.textContent = error.message; }
});
</script>
</body>
</html>
