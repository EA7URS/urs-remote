<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EA7URS Remote · Administración de usuarios</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #071114; color: #e5f2f2; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: start center; padding: 1rem; }
    main { width: min(100%, 52rem); margin: 2rem auto; padding: 1.5rem; border: 1px solid #17434b; border-radius: 1rem; background: #0d1d22; box-shadow: 0 1rem 4rem #0008; }
    header, .user-row, nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { margin: 0; color: #38d1c5; font-size: 1.5rem; }
    h2 { margin-top: 2rem; font-size: 1.1rem; }
    a, .role { color: #48cfc4; }
    nav { flex-wrap: wrap; }
    .user-row { padding: .9rem 0; border-bottom: 1px solid #17434b; }
    .user-info { display: grid; gap: .2rem; }
    .callsign { font-size: 1.1rem; font-weight: 700; }
    .muted { color: #a9bfc2; font-size: .9rem; }
    button, .button { padding: .65rem .9rem; border: 0; border-radius: .45rem; background: #12a99f; color: #031415; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    button.secondary, .button.secondary { border: 1px solid #28545b; background: transparent; color: #b8d0d2; }
    #notice { min-height: 1.4rem; margin: .8rem 0; color: #ff9b8f; }
    @media (max-width: 560px) { header, .user-row { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Administración de usuarios</h1>
    <nav aria-label="Navegación"><a href="/home.html">Inicio</a><a href="/index.html">Control de radio</a><button id="logout" class="secondary" type="button">Cerrar sesión</button></nav>
  </header>
  <p id="notice" role="status" aria-live="polite"></p>
  <section aria-labelledby="usersTitle">
    <header><h2 id="usersTitle">Usuarios</h2><a class="button" href="/admin-create.html">Crear usuario</a></header>
    <div id="users" aria-live="polite"></div>
  </section>
</main>
<script>
const notice = document.getElementById('notice');
async function api(url, options = {}) {
  const response = await fetch(url, { credentials: 'same-origin', ...options });
  const result = await response.json().catch(() => ({}));
  if (response.status === 401) { location.replace('/login.html'); throw new Error('Inicia sesión para continuar.'); }
  if (!response.ok) throw new Error(result.error || 'La solicitud ha fallado.');
  return result;
}
async function loadUsers() {
  const result = await api('/api/v1/admin/users');
  const target = document.getElementById('users');
  target.replaceChildren();
  if (!result.users.length) {
    const empty = document.createElement('p'); empty.className = 'muted'; empty.textContent = 'Todavía no hay usuarios.'; target.append(empty); return;
  }
  for (const user of result.users) {
    const row = document.createElement('article'); row.className = 'user-row';
    const info = document.createElement('div'); info.className = 'user-info';
    const id = document.createElement('a'); id.className = 'callsign';
    id.href = '/admin-edit.html?userId=' + encodeURIComponent(user.userId); id.textContent = user.userId;
    const details = document.createElement('span'); details.className = 'muted';
    details.textContent = (user.firstName + ' ' + user.lastName).trim() + (user.mustChangePassword ? ' · debe cambiar la contraseña' : '');
    const role = document.createElement('span'); role.className = 'role';
    role.textContent = (user.isAdmin ? 'Administrador' : 'Usuario') + ' · ' +
      (user.operationalProfile === 'capture' ? 'Usuario de captación' : 'Usuario con licencia');
    info.append(id, details, role); row.append(info);
    if (!user.isAdmin) {
      const promote = document.createElement('button'); promote.type = 'button'; promote.textContent = 'Promover a administrador';
      promote.addEventListener('click', async () => {
        try { await api('/api/v1/admin/users/' + encodeURIComponent(user.userId) + '/promote', { method: 'POST' }); await loadUsers(); notice.textContent = user.userId + ' ahora es administrador.'; }
        catch (error) { notice.textContent = error.message; }
      });
      row.append(promote);
    }
    target.append(row);
  }
}
api('/api/v1/auth/me').then(user => {
  if (!user.isAdmin) location.replace('/home.html');
  else loadUsers().catch(error => { notice.textContent = error.message; });
}).catch(error => { notice.textContent = error.message; });
document.getElementById('logout').addEventListener('click', async () => {
  try { await api('/api/v1/auth/logout', { method: 'POST' }); }
  finally { location.replace('/login.html'); }
});
</script>
</body>
</html>
