<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EA7URS Remote · Editar usuario</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #071114; color: #e5f2f2; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; }
    main { width: min(100%, 52rem); padding: 1.5rem; border: 1px solid #17434b; border-radius: 1rem; background: #0d1d22; box-shadow: 0 1rem 4rem #0008; }
    header, nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { margin: 0; color: #38d1c5; font-size: 1.5rem; }
    a { color: #48cfc4; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .8rem; align-items: end; margin-top: 1.5rem; }
    label { display: grid; gap: .35rem; color: #b8d0d2; }
    input, select { width: 100%; padding: .7rem; border: 1px solid #28545b; border-radius: .45rem; background: #071114; color: #fff; font: inherit; }
    button { padding: .7rem 1rem; border: 0; border-radius: .45rem; background: #12a99f; color: #031415; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { border: 1px solid #28545b; background: transparent; color: #b8d0d2; }
    #notice { min-height: 1.4rem; margin: .8rem 0; color: #ff9b8f; }
    .quota-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem; margin: 1rem 0; }
    .quota-card { padding: 1rem; border: 1px solid #17434b; border-radius: .65rem; background: #09171b; }
    .quota-card h3 { margin: 0 0 .65rem; color: #38d1c5; }
    .quota-card p { margin: .35rem 0; color: #b8d0d2; }
    .quota-card button { margin-top: .6rem; }
    @media (max-width: 480px) { header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <header><h1>Editar usuario</h1><nav><a href="/home.html">Inicio</a><a href="/index.html">Control de radio</a><a href="/usage-profiles.html">Perfiles de tiempo</a><a href="/admin.html">Volver al listado</a><button id="logout" class="secondary" type="button">Cerrar sesión</button></nav></header>
  <p id="notice" role="status" aria-live="polite"></p>
  <form id="editForm" hidden>
    <label>Indicativo / ID<input name="userId" required maxlength="32"></label>
    <label>Nombre<input name="firstName" required maxlength="120"></label>
    <label>Apellidos<input name="lastName" required maxlength="120"></label>
    <label>Email<input name="email" type="email" required maxlength="254"></label>
    <label>Calle (opcional)<input name="street" maxlength="120"></label>
    <label>Población (opcional)<input name="city" maxlength="120"></label>
    <label>Código postal (opcional)<input name="postalCode" maxlength="120"></label>
    <label>Provincia (opcional)<input name="province" maxlength="120"></label>
    <label>Perfil operativo<select name="operationalProfile"><option value="licensed">Usuario con licencia</option><option value="capture">Usuario de captación</option></select></label>
    <label>Tiempos de uso autorizados<select name="usageProfileId" id="usageProfileId"><option value="">Sin límite</option></select></label>
    <label for="reservationTimeValue">Tiempo máximo por reserva<input id="reservationTimeValue" type="number" min="0" step="1" inputmode="numeric"></label>
    <label for="reservationTimeUnit">Unidad<select id="reservationTimeUnit"><option value="minutes">Minutos</option><option value="hours">Horas</option></select></label>
    <p class="muted">Un valor vacío o cero impide realizar reservas.</p>
    <p id="reservationStatus" class="muted" aria-live="polite"></p>
    <button type="submit">Guardar cambios</button>
  </form>
  <section id="usageSection" aria-labelledby="usageTitle" hidden>
    <h2 id="usageTitle">Tiempos de uso autorizados</h2>
    <p id="usageProfileName"></p>
    <div id="usagePeriods" class="quota-grid" aria-live="polite"></div>
  </section>
</main>
<script>
const notice = document.getElementById('notice');
const params = new URLSearchParams(location.search);
let selectedUserId = params.get('userId');
const periodNames = { daily: 'Diario', weekly: 'Semanal', monthly: 'Mensual' };
function readReservationMinutes() {
  const rawValue = document.getElementById('reservationTimeValue').value.trim();
  if (!rawValue) return 0;
  const value = Number(rawValue);
  const minutes = value * (document.getElementById('reservationTimeUnit').value === 'hours' ? 60 : 1);
  if (!Number.isSafeInteger(value) || value < 0 || !Number.isSafeInteger(minutes)) {
    throw new Error('El tiempo máximo por reserva debe ser un entero no negativo.');
  }
  return minutes;
}
function setReservationMinutes(minutes) {
  const value = Number(minutes) || 0;
  const input = document.getElementById('reservationTimeValue');
  const unit = document.getElementById('reservationTimeUnit');
  if (value > 0 && value % 60 === 0) {
    input.value = String(value / 60); unit.value = 'hours';
  } else {
    input.value = value > 0 ? String(value) : ''; unit.value = 'minutes';
  }
}
function renderReservationStatus(user) {
  const element = document.getElementById('reservationStatus');
  const effectiveMinutes = Number(user.effectiveReservationMinutes) || 0;
  element.textContent = user.canReserve
    ? 'Máximo reservable según los cupos de uso actuales: ' + effectiveMinutes + ' min.'
    : 'No puede realizar reservas con el límite configurado y los cupos de uso actuales.';
}
function formatDuration(seconds) {
  if (seconds == null) return 'Sin límite';
  let remaining = Math.max(0, Math.floor(seconds));
  const hours = Math.floor(remaining / 3600); remaining %= 3600;
  const minutes = Math.floor(remaining / 60); const secs = remaining % 60;
  const parts = [];
  if (hours) parts.push(hours + ' h');
  if (minutes) parts.push(minutes + ' min');
  if (secs && !hours) parts.push(secs + ' s');
  return parts.length ? parts.join(' ') : '0 min';
}
function renderUsage(usage) {
  document.getElementById('usageProfileName').textContent = 'Perfil asignado: ' + (usage.profileName || 'Sin límite');
  const target = document.getElementById('usagePeriods'); target.replaceChildren();
  const available = Object.keys(periodNames).filter(period => usage[period]);
  if (!available.length) {
    const message = document.createElement('p'); message.className = 'muted'; message.textContent = 'Este usuario no tiene límites de uso asignados.'; target.append(message); return;
  }
  for (const period of available) {
    const item = usage[period]; const card = document.createElement('article'); card.className = 'quota-card';
    const title = document.createElement('h3'); title.textContent = periodNames[period]; card.append(title);
    for (const [label, value] of [
      ['Límite', item.limitMinutes == null ? 'Sin límite' : formatDuration(item.limitMinutes * 60)],
      ['Usado', formatDuration(item.usedSeconds)],
      ['Restante', formatDuration(item.remainingSeconds)]
    ]) {
      const line = document.createElement('p'); line.textContent = label + ': ' + value; card.append(line);
    }
    if (item.limitMinutes != null) {
      const reset = document.createElement('button'); reset.type = 'button'; reset.textContent = 'Reiniciar límite ' + periodNames[period].toLowerCase();
      reset.addEventListener('click', async () => {
        if (!window.confirm('¿Reiniciar el uso ' + periodNames[period].toLowerCase() + ' de ' + selectedUserId + '? Los otros periodos no cambiarán.')) return;
        reset.disabled = true; notice.textContent = '';
        try {
          const result = await api('/api/v1/admin/users/' + encodeURIComponent(selectedUserId) + '/usage-reset', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ period })
          });
          renderUsage(result.usage); notice.textContent = 'Se ha reiniciado el límite ' + periodNames[period].toLowerCase() + '.';
        } catch (error) { notice.textContent = error.message; reset.disabled = false; }
      });
      card.append(reset);
    }
    target.append(card);
  }
}
async function api(url, options = {}) {
  const response = await fetch(url, { credentials: 'same-origin', ...options });
  const result = await response.json().catch(() => ({}));
  if (response.status === 401) { location.replace('/login.html'); throw new Error('Inicia sesión para continuar.'); }
  if (!response.ok) throw new Error(result.error || 'La solicitud ha fallado.');
  return result;
}
api('/api/v1/auth/me').then(async user => {
  if (!user.isAdmin) { location.replace('/home.html'); return; }
  if (!selectedUserId) throw new Error('Falta el indicativo del usuario.');
  const result = await api('/api/v1/admin/users');
  const selected = result.users.find(item => item.userId === selectedUserId);
  if (!selected) throw new Error('No se ha encontrado ese usuario.');
  const usageResult = await api('/api/v1/admin/users/' + encodeURIComponent(selectedUserId) + '/usage');
  renderUsage(usageResult.usage);
  document.getElementById('usageSection').hidden = false;
  const profiles = await api('/api/v1/admin/usage-profiles');
  for (const profile of profiles.profiles) {
    const option = document.createElement('option'); option.value = profile.profileId; option.textContent = profile.name;
    document.getElementById('usageProfileId').append(option);
  }
  const form = document.getElementById('editForm');
  for (const [name, value] of Object.entries(selected)) {
    const field = form.elements.namedItem(name);
    if (field && field.type !== 'checkbox') field.value = value == null ? '' : String(value);
  }
  setReservationMinutes(selected.maxReservationMinutes);
  renderReservationStatus(selected);
  form.dataset.originalId = selected.userId;
  form.hidden = false;
  if (params.has('created')) notice.textContent = 'Usuario creado. Revisa sus datos antes de compartir el acceso.';
}).catch(error => { notice.textContent = error.message; });
document.getElementById('editForm').addEventListener('submit', async event => {
  event.preventDefault(); notice.textContent = '';
  const form = event.target;
  try {
    const data = Object.fromEntries(new FormData(form).entries());
    data.maxReservationMinutes = readReservationMinutes();
    const result = await api('/api/v1/admin/users/' + encodeURIComponent(form.dataset.originalId), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
    });
    selectedUserId = result.userId;
    form.dataset.originalId = result.userId;
    notice.textContent = 'Se ha actualizado ' + result.userId + '.';
    history.replaceState(null, '', '/admin-edit.html?userId=' + encodeURIComponent(result.userId));
    const usageResult = await api('/api/v1/admin/users/' + encodeURIComponent(selectedUserId) + '/usage');
    renderUsage(usageResult.usage);
    renderReservationStatus(result.profile);
  } catch (error) { notice.textContent = error.message; }
});
document.getElementById('logout').addEventListener('click', async () => {
  try { await api('/api/v1/auth/logout', { method: 'POST' }); } finally { location.replace('/login.html'); }
});
</script>
</body>
</html>
