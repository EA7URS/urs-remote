<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EA7URS Remote · Inicio</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #071114; color: #e5f2f2; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; }
    main { width: min(100%, 46rem); padding: 2rem; border: 1px solid #17434b; border-radius: 1rem; background: #0d1d22; box-shadow: 0 1rem 4rem #0008; }
    header, nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { margin: 0; color: #38d1c5; font-size: 1.6rem; }
    p { color: #a9bfc2; line-height: 1.5; }
    #user { color: #48cfc4; font-family: monospace; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); margin-top: 1.5rem; }
    nav a { min-height: 5rem; display: flex; align-items: center; padding: 1rem; border: 1px solid #28545b; border-radius: .6rem; color: #e5f2f2; background: #10272c; font-weight: 650; text-decoration: none; }
    nav a:hover, nav a:focus-visible { border-color: #38d1c5; background: #15343a; }
    nav a[aria-disabled="true"] { opacity: .55; cursor: not-allowed; border-color: #28545b; }
    nav a[aria-disabled="true"]:hover, nav a[aria-disabled="true"]:focus-visible { border-color: #28545b; background: #10272c; }
    .schedule { margin-top: 1.75rem; padding-top: 1rem; border-top: 1px solid #17434b; }
    .schedule h2 { margin: 0; color: #38d1c5; font-size: 1.2rem; }
    .schedule-list { list-style: none; margin: .75rem 0 0; padding: 0; }
    .schedule-list li { margin-top: .55rem; padding: .8rem 1rem; border: 1px solid #28545b; border-radius: .55rem; background: #10272c; }
    .schedule-list li.active { border-color: #38d1c5; background: #123b3d; box-shadow: inset 3px 0 #38d1c5; }
    .schedule-holder { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem; font-weight: 650; }
    .schedule-callsign { color: #70e0d8; font-family: monospace; }
    .schedule-active { padding: .15rem .45rem; border-radius: 999px; color: #071114; background: #38d1c5; font-size: .75rem; }
    .schedule-time { display: block; margin-top: .35rem; color: #a9bfc2; }
    button { margin-top: 1.5rem; padding: .65rem 1rem; border: 1px solid #28545b; border-radius: .45rem; background: transparent; color: #b8d0d2; font: inherit; cursor: pointer; }
    #notice { color: #ff9b8f; }
  </style>
</head>
<body>
<main>
  <header><h1>EA7URS Remote</h1><span id="user"></span></header>
  <p>Elige qué quieres hacer.</p>
  <nav aria-label="Opciones de la cuenta">
    <a id="adminLink" href="/admin.html" hidden>Administración de usuarios</a>
    <a id="bandAdminLink" href="/allowed-bands.html" hidden>Bandas permitidas</a>
    <a href="/profile.html">Administrar perfil</a>
    <a href="/reservations.html">Reservar tiempo de radio</a>
    <a id="radioLink" href="/index.html">Ir a la radio</a>
  </nav>
  <section class="schedule" aria-labelledby="scheduleTitle">
    <h2 id="scheduleTitle">Reservas de los próximos 7 días</h2>
    <ol id="scheduleList" class="schedule-list" aria-live="polite"></ol>
    <p id="scheduleEmpty" hidden>No hay reservas confirmadas en este periodo.</p>
  </section>
  <p id="radioNotice" role="status" aria-live="polite" hidden></p>
  <p id="notice" role="status" aria-live="polite"></p>
  <button id="logout" type="button">Cerrar sesión</button>
</main>
<dialog id="reservationMissedDialog" aria-labelledby="reservationMissedTitle" style="max-width:min(90vw, 26rem); border:1px solid #38d1c5; border-radius:12px; padding:1.5rem; background:#0d1d22; color:#e5f2f2; box-shadow:0 1rem 4rem #000b">
  <h2 id="reservationMissedTitle" style="margin-top:0; color:#38d1c5">Reserva perdida</h2>
  <p id="reservationMissedMessage"></p>
  <button type="button" onclick="document.getElementById('reservationMissedDialog').close()">Entendido</button>
</dialog>
<script>
fetch('/api/v1/auth/me', { credentials: 'same-origin' }).then(async response => {
  if (!response.ok) { location.replace('/login.html'); return; }
  const user = await response.json();
  document.getElementById('user').textContent = user.userId;
  document.getElementById('adminLink').hidden = !user.isAdmin;
  document.getElementById('bandAdminLink').hidden = !user.isAdmin;
  const scheduleList = document.getElementById('scheduleList');
  const scheduleEmpty = document.getElementById('scheduleEmpty');
  const reservations = user.upcomingReservations || [];
  scheduleEmpty.hidden = reservations.length > 0;
  for (const reservation of reservations) {
    const row = document.createElement('li');
    if (reservation.isActive) {
      row.classList.add('active');
      row.setAttribute('aria-current', 'true');
    }
    const holder = document.createElement('div');
    holder.className = 'schedule-holder';
    const callsign = document.createElement('span');
    callsign.className = 'schedule-callsign';
    callsign.textContent = reservation.userId;
    holder.append(callsign);
    if (reservation.name) {
      const name = document.createElement('span');
      name.textContent = reservation.name;
      holder.append(name);
    }
    if (reservation.isActive) {
      const active = document.createElement('span');
      active.className = 'schedule-active';
      active.textContent = 'En curso';
      holder.append(active);
    }
    const time = document.createElement('time');
    time.className = 'schedule-time';
    time.dateTime = new Date(reservation.startsAt * 1000).toISOString();
    time.textContent = `${new Intl.DateTimeFormat('es-ES', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(reservation.startsAt * 1000))} – ${new Intl.DateTimeFormat('es-ES', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(reservation.endsAt * 1000))}`;
    row.append(holder, time);
    scheduleList.append(row);
  }
  const radioLink = document.getElementById('radioLink');
  const radioNotice = document.getElementById('radioNotice');
  if (!user.canAccessRadio) {
    radioNotice.hidden = false;
    radioNotice.textContent = user.radioAccessMessage || 'Has agotado el tiempo autorizado para usar la radio.';
    if (user.reservationMissed) {
      radioLink.addEventListener('click', event => {
        event.preventDefault();
        document.getElementById('reservationMissedMessage').textContent = user.radioAccessMessage;
        document.getElementById('reservationMissedDialog').showModal();
      });
    } else {
      radioLink.removeAttribute('href');
      radioLink.setAttribute('aria-disabled', 'true');
      radioLink.setAttribute('tabindex', '-1');
      radioLink.textContent = 'Ir a la radio · acceso no disponible';
    }
  }
}).catch(() => location.replace('/login.html'));
document.getElementById('logout').addEventListener('click', async () => {
  try {
    const response = await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' });
    if (!response.ok) throw new Error('No se pudo cerrar la sesión.');
    location.replace('/login.html');
  } catch (error) {
    document.getElementById('notice').textContent = error.message;
  }
});
</script>
</body>
</html>
